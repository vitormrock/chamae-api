spring.application.name=api

# 👇 1. Substitua PORTA e NOME_DO_BANCO pelos valores do seu Docker:
spring.datasource.url=jdbc:postgresql://localhost:5432/chamae_db

# 👇 2. Coloque o utilizador que você criou no POSTGRES_USER:
spring.datasource.username=chamae_user

# 👇 3. Coloque a senha que você criou no POSTGRES_PASSWORD:
spring.datasource.password=chamae_secret_123

# Configurações do Hibernate (JPA) para criar as tabelas e mostrar o SQL no console:
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
