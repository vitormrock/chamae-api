  services:
    postgres:
      image: postgres:16-alpine
      container_name: chamae-postgres
      environment:

        # 👇 DESAFIO 1: Defina o nome do banco (POSTGRES_DB) como: chamae_db
        POSTGRES_DB: chamae_db

        # 👇 DESAFIO 2: Defina o utilizador (POSTGRES_USER) como: postgres
        POSTGRES_USER: chamae_user

        # 👇 DESAFIO 3: Defina a senha (POSTGRES_PASSWORD) como: 123456
        POSTGRES_PASSWORD: chamae_secret_123

        # 👇 DESAFIO 4: Mapeie a porta padrão do PostgreSQL ("5432:5432")
      ports:
        - "5432:5432"